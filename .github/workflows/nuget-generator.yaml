name: Publish synchronized FhirPkg SDK and CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Three-component NuGet version (for example, 2026.717.1608)
        required: true
        type: string
      tag:
        description: Matching release tag (v<version>)
        required: true
        type: string
      validation_only:
        description: Validate the complete release pipeline without publishing
        required: true
        default: true
        type: boolean
      recover_run_id:
        description: Original release run to finish (recovery only)
        required: false
        default: ''
        type: string
      approval_commit:
        description: Full SHA of the main commit holding docs/releases/approvals/v<version>.json (recovery only)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nuget-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      main_commit: ${{ steps.release.outputs.main_commit }}
      version: ${{ steps.inputs.outputs.version }}
      tag: ${{ steps.inputs.outputs.tag }}
      validation_only: ${{ steps.inputs.outputs.validation_only }}
      mode: ${{ steps.inputs.outputs.mode }}
      recover_run_id: ${{ steps.inputs.outputs.recover_run_id }}
      approval_commit: ${{ steps.inputs.outputs.approval_commit }}
      bundle_artifact_id: ${{ steps.bundle.outputs.bundle_artifact_id }}
      bundle_artifact_digest: ${{ steps.bundle.outputs.bundle_artifact_digest }}
      bundle_run_id: ${{ steps.bundle.outputs.bundle_run_id }}
      corpus_blob: ${{ steps.bundle.outputs.corpus_blob }}
      release_published: ${{ steps.recovery.outputs.release_published }}
      candidate_artifact_id: ${{ steps.recovery.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.recovery.outputs.candidate_artifact_digest }}
      original_bundle_artifact_id: ${{ steps.recovery.outputs.original_bundle_artifact_id }}
      original_bundle_artifact_digest: ${{ steps.recovery.outputs.original_bundle_artifact_digest }}
      approval_author: ${{ steps.recovery.outputs.approval_author }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve release inputs
        id: inputs
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VALIDATION_ONLY: ${{ inputs.validation_only }}
          INPUT_RECOVER_RUN_ID: ${{ inputs.recover_run_id }}
          INPUT_APPROVAL_COMMIT: ${{ inputs.approval_commit }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:EVENT_NAME -ceq 'release')
          {
            $tag = $env:RELEASE_EVENT_TAG
            if (!$tag.StartsWith('v', [StringComparison]::Ordinal))
            {
              throw "Release tag '$tag' must start with 'v'."
            }

            $version = $tag.Substring(1)
            $validationOnly = 'false'
            $mode = 'release'
            $recoverRunId = ''
            $approvalCommit = ''
          }
          elseif ($env:EVENT_NAME -ceq 'workflow_dispatch')
          {
            $version = $env:INPUT_VERSION
            $tag = $env:INPUT_TAG
            $recoverRunId = $env:INPUT_RECOVER_RUN_ID
            $approvalCommit = $env:INPUT_APPROVAL_COMMIT
            if ([string]::IsNullOrEmpty($recoverRunId))
            {
              if (![string]::IsNullOrEmpty($approvalCommit))
              {
                throw 'approval_commit requires recover_run_id.'
              }

              if ($env:INPUT_VALIDATION_ONLY -cne 'true')
              {
                throw 'Manual workflow dispatch is validation-only unless recover_run_id names the release run being finished.'
              }

              $validationOnly = 'true'
              $mode = 'validation'
            }
            else
            {
              if ($recoverRunId -cnotmatch '^[1-9][0-9]*$')
              {
                throw "recover_run_id '$recoverRunId' must be a workflow run id: a positive integer with no leading zero."
              }

              if (![string]::IsNullOrEmpty($approvalCommit) -and
                  $approvalCommit -cnotmatch '^[0-9a-f]{40}$')
              {
                throw "approval_commit '$approvalCommit' must be the full 40-character lowercase commit SHA."
              }

              if ($env:INPUT_VALIDATION_ONLY -ceq 'false')
              {
                $validationOnly = 'false'
              }
              else
              {
                $validationOnly = 'true'
              }

              $mode = 'recovery'
            }
          }
          else
          {
            throw "Unsupported release event '$env:EVENT_NAME'."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "validation_only=$validationOnly"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "mode=$mode"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "recover_run_id=$recoverRunId"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "approval_commit=$approvalCommit"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore release validation tool
        run: dotnet restore tools/FhirPkg.Release/FhirPkg.Release.csproj

      - name: Build release validation tool
        run: >-
          dotnet build tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-restore

      - name: Validate release inputs, tag, and main ancestry
        id: release
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-inputs
          --version "${{ steps.inputs.outputs.version }}"
          --tag "${{ steps.inputs.outputs.tag }}"
          --github-ref "${{ github.ref }}"
          ${{ steps.inputs.outputs.mode == 'recovery' && '--allow-published-version' || '' }}

      - name: Locate frozen fixture bundle
        id: bundle
        if: ${{ steps.inputs.outputs.mode != 'recovery' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          locate-fixture-bundle
          --repository "${{ github.repository }}"
          --commit "${{ steps.release.outputs.commit }}"
          --tag "${{ steps.inputs.outputs.tag }}"

      - name: Authorize recovery
        id: recovery
        if: ${{ steps.inputs.outputs.mode == 'recovery' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          verify-recovery
          --repository "${{ github.repository }}"
          --version "${{ steps.inputs.outputs.version }}"
          --tag "${{ steps.inputs.outputs.tag }}"
          --commit "${{ steps.release.outputs.commit }}"
          --recover-run-id "${{ steps.inputs.outputs.recover_run_id }}"
          --approval-commit "${{ steps.inputs.outputs.approval_commit }}"
          ${{ steps.inputs.outputs.validation_only == 'true' && '--dry-run' || '' }}

  source-ci:
    name: exact-source-ci
    needs: validate
    if: ${{ needs.validate.outputs.mode != 'recovery' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-test.yaml
    with:
      commit_sha: ${{ needs.validate.outputs.commit }}

  pack:
    name: pack-release-candidate
    needs: [validate, source-ci]
    if: ${{ needs.validate.outputs.mode != 'recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sdk_package_sha256: ${{ steps.candidate.outputs.sdk_sha256 }}
      cli_package_sha256: ${{ steps.candidate.outputs.cli_sha256 }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
      candidate_run_id: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify exact source commit
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
          {
            throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.302
            9.0.119
            8.0.423

      - name: Restore release validation tool
        run: dotnet restore tools/FhirPkg.Release/FhirPkg.Release.csproj

      - name: Restore release graph
        run: dotnet restore src/FhirPkg.Cli/FhirPkg.Cli.csproj

      - name: Build release validation tool
        run: >-
          dotnet build tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-restore

      - name: Download frozen fixture bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          fetch-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.validate.outputs.bundle_artifact_id }}"
          --expected-digest "${{ needs.validate.outputs.bundle_artifact_digest }}"
          --destination "${{ runner.temp }}/fixture-bundle"

      - name: Record qualification input identity
        id: bundle
        shell: pwsh
        run: |
          $manifestPath = Join-Path `
            '${{ runner.temp }}' `
            'fixture-bundle/bundle-manifest.json'
          $bundleSha256 =
            (Get-FileHash -Algorithm SHA256 -LiteralPath $manifestPath).
              Hash.
              ToLowerInvariant()
          Add-Content `
            -Path $env:GITHUB_OUTPUT `
            -Value "bundle_sha256=$bundleSha256"

      - name: Build release graph once
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          dotnet build src/FhirPkg.Cli/FhirPkg.Cli.csproj `
            --configuration Release `
            --no-restore `
            "-p:VersionPrefix=$env:RELEASE_VERSION" `
            "-p:Version=$env:RELEASE_VERSION" `
            "-p:PackageVersion=$env:RELEASE_VERSION" `
            "-p:AssemblyVersion=0.$env:RELEASE_VERSION" `
            "-p:FileVersion=0.$env:RELEASE_VERSION" `
            "-p:RepositoryCommit=$env:RELEASE_COMMIT"

      - name: Pack synchronized release candidate once
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $candidateDirectory =
            Join-Path '${{ runner.temp }}' 'release-candidate'
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $candidateDirectory |
            Out-Null
          $properties = @(
            "-p:VersionPrefix=$env:RELEASE_VERSION",
            "-p:Version=$env:RELEASE_VERSION",
            "-p:PackageVersion=$env:RELEASE_VERSION",
            "-p:AssemblyVersion=0.$env:RELEASE_VERSION",
            "-p:FileVersion=0.$env:RELEASE_VERSION",
            "-p:RepositoryCommit=$env:RELEASE_COMMIT"
          )
          dotnet pack src/FhirPkg/FhirPkg.csproj `
            --configuration Release `
            --no-build `
            --output $candidateDirectory `
            @properties
          if ($LASTEXITCODE -ne 0)
          {
            throw 'SDK package creation failed.'
          }

          dotnet pack src/FhirPkg.Cli/FhirPkg.Cli.csproj `
            --configuration Release `
            --no-build `
            --output $candidateDirectory `
            @properties
          if ($LASTEXITCODE -ne 0)
          {
            throw 'CLI package creation failed.'
          }

      - name: Create SHA-512 manifest and release metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $candidateDirectory =
            Join-Path '${{ runner.temp }}' 'release-candidate'
          $packageRecords = @()
          foreach ($packageId in @('fhir-pkg-lib', 'fhir-pkg-cli'))
          {
            $packageName =
              "$packageId.$env:RELEASE_VERSION.nupkg"
            $symbolsName =
              "$packageId.$env:RELEASE_VERSION.snupkg"
            $packagePath =
              Join-Path $candidateDirectory $packageName
            $symbolsPath =
              Join-Path $candidateDirectory $symbolsName
            if (!(Test-Path -LiteralPath $packagePath -PathType Leaf))
            {
              throw "Package '$packagePath' was not created."
            }

            if (!(Test-Path -LiteralPath $symbolsPath -PathType Leaf))
            {
              throw "Symbols package '$symbolsPath' was not created."
            }

            [string[]] $manifestLines = foreach ($path in @(
              $packagePath,
              $symbolsPath))
            {
              $hash =
                (Get-FileHash -Algorithm SHA512 -Path $path).
                  Hash.
                  ToLowerInvariant()
              "$hash  $([System.IO.Path]::GetFileName($path))"
            }
            $manifestPath =
              Join-Path `
                $candidateDirectory `
                "$packageId.$env:RELEASE_VERSION.sha512"
            $manifestLines |
              Set-Content -Encoding ascii -Path $manifestPath

            $packageRecords += [ordered]@{
              packageId = $packageId
              packageFile = $packageName
              symbolsFile = $symbolsName
              packageSha256 = (
                Get-FileHash -Algorithm SHA256 -Path $packagePath
              ).Hash.ToLowerInvariant()
              symbolsSha256 = (
                Get-FileHash -Algorithm SHA256 -Path $symbolsPath
              ).Hash.ToLowerInvariant()
              packageSha512 = $manifestLines[0].Split(' ', 2)[0]
              symbolsSha512 = $manifestLines[1].Split(' ', 2)[0]
            }
          }

          $metadata = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            repositoryCommit = $env:RELEASE_COMMIT
            feed = 'https://api.nuget.org/v3/index.json'
            packages = $packageRecords
            sdkVersion = (dotnet --version).Trim()
            sdkCommit = (
              (dotnet --info |
                Where-Object { $_ -match '^\s*Commit:\s+\S+' } |
                Select-Object -First 1) -replace '^\s*Commit:\s+', ''
            ).Trim()
          }
          $metadata |
            ConvertTo-Json -Depth 4 |
            Set-Content `
              -Encoding utf8 `
              -Path (Join-Path $candidateDirectory 'release-metadata.json')

      - name: Verify release candidate
        id: candidate
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-candidate
          --candidate-directory "${{ runner.temp }}/release-candidate"
          --version "${{ needs.validate.outputs.version }}"
          --tag "${{ needs.validate.outputs.tag }}"
          --repository-commit "${{ needs.validate.outputs.commit }}"

      - name: Upload immutable release candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fhir-pkg-${{ needs.validate.outputs.version }}-candidate
          path: ${{ runner.temp }}/release-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload qualification inputs
        uses: actions/upload-artifact@v4
        with:
          name: fhir-pkg-${{ needs.validate.outputs.version }}-fixture-bundle
          path: ${{ runner.temp }}/fixture-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  retrieve:
    name: retrieve-release-candidate
    needs: validate
    if: ${{ needs.validate.outputs.mode == 'recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sdk_package_sha256: ${{ steps.candidate.outputs.sdk_sha256 }}
      cli_package_sha256: ${{ steps.candidate.outputs.cli_sha256 }}
      artifact_digest: ${{ needs.validate.outputs.candidate_artifact_digest }}
      bundle_sha256: ${{ steps.inputs_identity.outputs.bundle_sha256 }}
      base_bundle_sha256: ${{ steps.base_identity.outputs.base_bundle_sha256 }}
      candidate_run_id: ${{ needs.validate.outputs.recover_run_id }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify exact source commit
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
          {
            throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore release validation tool
        run: dotnet restore tools/FhirPkg.Release/FhirPkg.Release.csproj

      - name: Build release validation tool
        run: >-
          dotnet build tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-restore

      - name: Retrieve original release candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          fetch-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.validate.outputs.candidate_artifact_id }}"
          --expected-digest "${{ needs.validate.outputs.candidate_artifact_digest }}"
          --destination "${{ runner.temp }}/release-candidate"

      - name: Verify original release candidate
        id: candidate
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-candidate
          --candidate-directory "${{ runner.temp }}/release-candidate"
          --version "${{ needs.validate.outputs.version }}"
          --tag "${{ needs.validate.outputs.tag }}"
          --repository-commit "${{ needs.validate.outputs.commit }}"

      - name: Retrieve original qualification inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          fetch-artifact
          --repository "${{ github.repository }}"
          --artifact-id "${{ needs.validate.outputs.original_bundle_artifact_id }}"
          --expected-digest "${{ needs.validate.outputs.original_bundle_artifact_digest }}"
          --destination "${{ runner.temp }}/original-fixture-bundle"

      - name: Record original qualification input identity
        id: base_identity
        shell: pwsh
        run: |
          $manifestPath = Join-Path `
            '${{ runner.temp }}' `
            'original-fixture-bundle/bundle-manifest.json'
          $baseBundleSha256 =
            (Get-FileHash -Algorithm SHA256 -LiteralPath $manifestPath).
              Hash.
              ToLowerInvariant()
          Add-Content `
            -Path $env:GITHUB_OUTPUT `
            -Value "base_bundle_sha256=$baseBundleSha256"

      - name: Extract fixture approval
        if: ${{ needs.validate.outputs.approval_commit != '' }}
        shell: bash
        env:
          APPROVAL_COMMIT: ${{ needs.validate.outputs.approval_commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git show "${APPROVAL_COMMIT}:docs/releases/approvals/${RELEASE_TAG}.json" > "${RUNNER_TEMP}/fixture-approval.json"

      - name: Restore qualification harness
        if: ${{ needs.validate.outputs.approval_commit != '' }}
        run: dotnet restore test/FhirPkg.Qualification/FhirPkg.Qualification.csproj

      - name: Derive approved qualification inputs
        if: ${{ needs.validate.outputs.approval_commit != '' }}
        shell: pwsh
        env:
          BASE_BUNDLE_SHA256: ${{ steps.base_identity.outputs.base_bundle_sha256 }}
          APPROVAL_COMMIT: ${{ needs.validate.outputs.approval_commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $bundle = Join-Path '${{ runner.temp }}' 'fixture-bundle'
          $baseBundle = Join-Path '${{ runner.temp }}' 'original-fixture-bundle'
          $approval = Join-Path '${{ runner.temp }}' 'fixture-approval.json'
          $cache = Join-Path '${{ runner.temp }}' 'derive-cache'
          $report = Join-Path '${{ runner.temp }}' 'derive-report.json'
          dotnet run `
            --project test/FhirPkg.Qualification/FhirPkg.Qualification.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-restore `
            -- `
            --derive-bundle $bundle `
            --bundle $baseBundle `
            --bundle-sha256 $env:BASE_BUNDLE_SHA256 `
            --approval $approval `
            --approval-commit $env:APPROVAL_COMMIT `
            --release-tag $env:RELEASE_TAG `
            --cache $cache `
            --output $report `
            --corpus test/FhirPkg.Qualification/qualification-corpus.json `
            --summary $env:GITHUB_STEP_SUMMARY `
            --summary-title retrieve-release-candidate

      - name: Reuse original qualification inputs
        if: ${{ needs.validate.outputs.approval_commit == '' }}
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath (Join-Path '${{ runner.temp }}' 'original-fixture-bundle') `
            -Destination (Join-Path '${{ runner.temp }}' 'fixture-bundle') `
            -Recurse

      - name: Record qualification input identity
        id: inputs_identity
        shell: pwsh
        run: |
          $manifestPath = Join-Path `
            '${{ runner.temp }}' `
            'fixture-bundle/bundle-manifest.json'
          $bundleSha256 =
            (Get-FileHash -Algorithm SHA256 -LiteralPath $manifestPath).
              Hash.
              ToLowerInvariant()
          Add-Content `
            -Path $env:GITHUB_OUTPUT `
            -Value "bundle_sha256=$bundleSha256"

      - name: Upload qualification inputs
        uses: actions/upload-artifact@v4
        with:
          name: fhir-pkg-${{ needs.validate.outputs.version }}-fixture-bundle
          path: ${{ runner.temp }}/fixture-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload derivation report
        if: ${{ always() && needs.validate.outputs.approval_commit != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixture-derivation-report-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/derive-report.json
          if-no-files-found: warn
          retention-days: 90

  release-identity:
    name: release-identity
    needs: [validate, pack, retrieve]
    if: >-
      ${{
        !cancelled() &&
        needs.validate.result == 'success' &&
        (needs.pack.result == 'success' || needs.retrieve.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_run_id: ${{ steps.identity.outputs.candidate_run_id }}
      sdk_package_sha256: ${{ steps.identity.outputs.sdk_package_sha256 }}
      cli_package_sha256: ${{ steps.identity.outputs.cli_package_sha256 }}
      artifact_digest: ${{ steps.identity.outputs.artifact_digest }}
      bundle_sha256: ${{ steps.identity.outputs.bundle_sha256 }}

    steps:
      - name: Resolve and record release identity
        id: identity
        shell: pwsh
        env:
          MODE: ${{ needs.validate.outputs.mode }}
          PACK_RESULT: ${{ needs.pack.result }}
          RETRIEVE_RESULT: ${{ needs.retrieve.result }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          BUNDLE_RUN_ID: ${{ needs.validate.outputs.bundle_run_id }}
          CORPUS_BLOB: ${{ needs.validate.outputs.corpus_blob }}
          APPROVAL_COMMIT: ${{ needs.validate.outputs.approval_commit }}
          APPROVAL_AUTHOR: ${{ needs.validate.outputs.approval_author }}
          PACK_CANDIDATE_RUN_ID: ${{ needs.pack.outputs.candidate_run_id }}
          PACK_SDK_PACKAGE_SHA256: ${{ needs.pack.outputs.sdk_package_sha256 }}
          PACK_CLI_PACKAGE_SHA256: ${{ needs.pack.outputs.cli_package_sha256 }}
          PACK_ARTIFACT_DIGEST: ${{ needs.pack.outputs.artifact_digest }}
          PACK_BUNDLE_SHA256: ${{ needs.pack.outputs.bundle_sha256 }}
          RETRIEVE_CANDIDATE_RUN_ID: ${{ needs.retrieve.outputs.candidate_run_id }}
          RETRIEVE_SDK_PACKAGE_SHA256: ${{ needs.retrieve.outputs.sdk_package_sha256 }}
          RETRIEVE_CLI_PACKAGE_SHA256: ${{ needs.retrieve.outputs.cli_package_sha256 }}
          RETRIEVE_ARTIFACT_DIGEST: ${{ needs.retrieve.outputs.artifact_digest }}
          RETRIEVE_BUNDLE_SHA256: ${{ needs.retrieve.outputs.bundle_sha256 }}
          RETRIEVE_BASE_BUNDLE_SHA256: ${{ needs.retrieve.outputs.base_bundle_sha256 }}
          RUNS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          if ($env:MODE -ceq 'recovery')
          {
            if ($env:RETRIEVE_RESULT -cne 'success' -or
                $env:PACK_RESULT -cne 'skipped')
            {
              throw "A recovery run requires retrieve-release-candidate to succeed and pack-release-candidate to be skipped, not '$env:RETRIEVE_RESULT' and '$env:PACK_RESULT'."
            }

            $candidateRunId = $env:RETRIEVE_CANDIDATE_RUN_ID
            $sdkPackageSha256 = $env:RETRIEVE_SDK_PACKAGE_SHA256
            $cliPackageSha256 = $env:RETRIEVE_CLI_PACKAGE_SHA256
            $artifactDigest = $env:RETRIEVE_ARTIFACT_DIGEST
            $bundleSha256 = $env:RETRIEVE_BUNDLE_SHA256
            $baseBundleSha256 = $env:RETRIEVE_BASE_BUNDLE_SHA256
          }
          else
          {
            if ($env:PACK_RESULT -cne 'success' -or
                $env:RETRIEVE_RESULT -cne 'skipped')
            {
              throw "A $env:MODE run requires pack-release-candidate to succeed and retrieve-release-candidate to be skipped, not '$env:PACK_RESULT' and '$env:RETRIEVE_RESULT'."
            }

            $candidateRunId = $env:PACK_CANDIDATE_RUN_ID
            $sdkPackageSha256 = $env:PACK_SDK_PACKAGE_SHA256
            $cliPackageSha256 = $env:PACK_CLI_PACKAGE_SHA256
            $artifactDigest = "sha256:$env:PACK_ARTIFACT_DIGEST"
            $bundleSha256 = $env:PACK_BUNDLE_SHA256
            $baseBundleSha256 = $null
          }

          $sha256Values = [ordered]@{
            sdk_package_sha256 = $sdkPackageSha256
            cli_package_sha256 = $cliPackageSha256
            bundle_sha256 = $bundleSha256
          }
          if ($env:MODE -ceq 'recovery')
          {
            $sha256Values['base_bundle_sha256'] = $baseBundleSha256
          }

          foreach ($name in $sha256Values.Keys)
          {
            if ("$($sha256Values[$name])" -cnotmatch '^[0-9a-f]{64}$')
            {
              throw "$name '$($sha256Values[$name])' must be 64 lowercase hexadecimal characters."
            }
          }

          if ("$artifactDigest" -cnotmatch '^sha256:[0-9a-f]{64}$')
          {
            throw "artifact_digest '$artifactDigest' must be 'sha256:' followed by 64 lowercase hexadecimal characters."
          }

          if ("$candidateRunId" -cnotmatch '^[1-9][0-9]*$')
          {
            throw "candidate_run_id '$candidateRunId' must be a workflow run id."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "candidate_run_id=$candidateRunId"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sdk_package_sha256=$sdkPackageSha256"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "cli_package_sha256=$cliPackageSha256"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact_digest=$artifactDigest"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "bundle_sha256=$bundleSha256"

          $candidateRunUrl = "$env:RUNS_URL/$candidateRunId"
          if ($env:MODE -ceq 'recovery')
          {
            $sourceCi = "original run [$candidateRunId]($candidateRunUrl) (linked, not re-run)"
          }
          else
          {
            $sourceCi = 'this run'
          }

          $summary = @(
            '### Release identity',
            '',
            '#### Product candidate',
            '',
            "- Version: $env:RELEASE_VERSION",
            "- Tag: $env:RELEASE_TAG",
            "- Commit: $env:RELEASE_COMMIT",
            "- Candidate run: [$candidateRunId]($candidateRunUrl)",
            "- Workflow artifact digest: $artifactDigest",
            "- fhir-pkg-lib SHA-256: $sdkPackageSha256",
            "- fhir-pkg-cli SHA-256: $cliPackageSha256",
            "- Source CI: $sourceCi",
            '',
            '#### Qualification inputs',
            '',
            "- Bundle SHA-256: $bundleSha256"
          )
          if ($env:MODE -ceq 'recovery')
          {
            $summary += "- Base bundle SHA-256: $baseBundleSha256"
          }
          else
          {
            $summary += "- Producing drift run: [$env:BUNDLE_RUN_ID]($env:RUNS_URL/$env:BUNDLE_RUN_ID)"
            $summary += "- Corpus blob: $env:CORPUS_BLOB"
          }

          if ([string]::IsNullOrEmpty($env:APPROVAL_COMMIT))
          {
            $summary += '- Approval: none'
          }
          else
          {
            $summary += "- Approval commit: $env:APPROVAL_COMMIT"
            $summary += "- Approval author: ``$env:APPROVAL_AUTHOR``"
          }

          if ($env:MODE -ceq 'recovery')
          {
            $summary += @(
              '',
              '#### Recovery',
              '',
              "- This run: [$env:RUN_ID]($env:RUNS_URL/$env:RUN_ID)",
              "- Workflow SHA: $env:WORKFLOW_SHA"
            )
          }

          try
          {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }
          catch
          {
            Write-Warning "The release identity summary was not written: $($_.Exception.Message)"
          }

  package-qualification:
    name: qualify-${{ matrix.os }}-${{ matrix.framework }}
    needs: [validate, release-identity]
    if: ${{ !cancelled() && needs.release-identity.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net8.0, net9.0, net10.0]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify exact source commit
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
          {
            throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
          }

      - name: Write candidate identity summary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          SDK_PACKAGE_SHA256: ${{ needs.release-identity.outputs.sdk_package_sha256 }}
          CLI_PACKAGE_SHA256: ${{ needs.release-identity.outputs.cli_package_sha256 }}
          ARTIFACT_DIGEST: ${{ needs.release-identity.outputs.artifact_digest }}
          CANDIDATE_RUN_ID: ${{ needs.release-identity.outputs.candidate_run_id }}
        run: |
          $summary = @(
            '### Candidate',
            '',
            "- Artifact: fhir-pkg-$env:RELEASE_VERSION-candidate",
            "- Workflow artifact digest: $env:ARTIFACT_DIGEST",
            "- fhir-pkg-lib SHA-256: $env:SDK_PACKAGE_SHA256",
            "- fhir-pkg-cli SHA-256: $env:CLI_PACKAGE_SHA256",
            "- Release commit: $env:RELEASE_COMMIT",
            "- Candidate run id: $env:CANDIDATE_RUN_ID"
          )
          try
          {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }
          catch
          {
            Write-Warning "The candidate identity summary was not written: $($_.Exception.Message)"
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.302
            9.0.119
            8.0.423

      - name: Restore release validation tool
        run: dotnet restore tools/FhirPkg.Release/FhirPkg.Release.csproj

      - name: Build release validation tool
        run: >-
          dotnet build tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-restore

      - name: Configure isolated global packages folder
        shell: pwsh
        run: |
          $globalPackages = Join-Path `
            '${{ runner.temp }}' `
            'qualification-global-packages'
          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "NUGET_PACKAGES=$globalPackages"

      - name: Download immutable release candidate
        uses: actions/download-artifact@v4
        with:
          name: fhir-pkg-${{ needs.validate.outputs.version }}-candidate
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ needs.release-identity.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded release candidate
        id: candidate
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-candidate
          --candidate-directory "${{ runner.temp }}/release-candidate"
          --version "${{ needs.validate.outputs.version }}"
          --tag "${{ needs.validate.outputs.tag }}"
          --repository-commit "${{ needs.validate.outputs.commit }}"
          --expected-sdk-package-sha256 "${{ needs.release-identity.outputs.sdk_package_sha256 }}"
          --expected-cli-package-sha256 "${{ needs.release-identity.outputs.cli_package_sha256 }}"

      - name: Create isolated qualification package source
        id: nuget
        shell: pwsh
        run: |
          $candidateDirectory =
            Join-Path '${{ runner.temp }}' 'release-candidate'
          $escapedCandidateDirectory =
            [System.Security.SecurityElement]::Escape($candidateDirectory)
          $configPath =
            Join-Path '${{ runner.temp }}' 'qualification.NuGet.Config'
          @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<configuration>',
            '  <packageSources>',
            '    <clear />',
            "    <add key=`"candidate`" value=`"$escapedCandidateDirectory`" />",
            '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />',
            '  </packageSources>',
            '  <packageSourceMapping>',
            '    <packageSource key="candidate">',
            '      <package pattern="fhir-pkg-lib" />',
            '      <package pattern="fhir-pkg-cli" />',
            '    </packageSource>',
            '    <packageSource key="nuget.org">',
            '      <package pattern="Microsoft.*" />',
            '      <package pattern="NETStandard.*" />',
            '      <package pattern="runtime.*" />',
            '      <package pattern="System.*" />',
            '    </packageSource>',
            '  </packageSourceMapping>',
            '</configuration>'
          ) | Set-Content -Encoding utf8 -Path $configPath
          Add-Content -Path $env:GITHUB_OUTPUT -Value "config_path=$configPath"

      - name: Restore qualification against exact local package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
        run: |
          dotnet restore `
            test/FhirPkg.Qualification/FhirPkg.Qualification.csproj `
            --configfile '${{ steps.nuget.outputs.config_path }}' `
            --force `
            --no-cache `
            "-p:TargetFramework=$env:TARGET_FRAMEWORK" `
            "-p:UsePublishedFhirPkg=true" `
            "-p:FhirPkgQualificationPackageVersion=$env:RELEASE_VERSION"

      - name: Verify exact package restore and selected framework asset
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
          SDK_PACKAGE_SHA256: ${{ needs.release-identity.outputs.sdk_package_sha256 }}
        run: |
          $candidatePackage = Join-Path `
            '${{ runner.temp }}/release-candidate' `
            "fhir-pkg-lib.$env:RELEASE_VERSION.nupkg"
          foreach ($assetsPath in @(
            'test/FhirPkg.Qualification/obj/project.assets.json',
            'test/FhirPkg.ProcessTestHost/obj/project.assets.json'))
          {
            ./.github/scripts/Test-QualificationRestore.ps1 `
              -AssetsPath $assetsPath `
              -GlobalPackagesPath $env:NUGET_PACKAGES `
              -CandidatePackagePath $candidatePackage `
              -Version $env:RELEASE_VERSION `
              -Framework $env:TARGET_FRAMEWORK `
              -ExpectedPackageSha256 $env:SDK_PACKAGE_SHA256
          }

      - name: Install exact CLI package for requested framework
        id: tool
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
        run: |
          $toolPath = Join-Path '${{ runner.temp }}' 'qualification-tool'
          New-Item -ItemType Directory -Force -Path $toolPath |
            Out-Null
          dotnet tool install fhir-pkg-cli `
            --version $env:RELEASE_VERSION `
            --framework $env:TARGET_FRAMEWORK `
            --tool-path $toolPath `
            --configfile '${{ steps.nuget.outputs.config_path }}' `
            --no-cache
          if ($LASTEXITCODE -ne 0)
          {
            throw 'CLI tool installation failed.'
          }

          Add-Content `
            -Path $env:GITHUB_OUTPUT `
            -Value "tool_path=$toolPath"

      - name: Verify exact CLI restore and smoke test
        id: tool_qualification
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
          CLI_PACKAGE_SHA256: ${{ needs.release-identity.outputs.cli_package_sha256 }}
        run: |
          ./.github/scripts/Test-ToolQualification.ps1 `
            -ToolPath '${{ steps.tool.outputs.tool_path }}' `
            -CandidateDirectory '${{ runner.temp }}/release-candidate' `
            -Framework $env:TARGET_FRAMEWORK `
            -Version $env:RELEASE_VERSION `
            -RepositoryCommit $env:RELEASE_COMMIT `
            -ExpectedPackageSha256 $env:CLI_PACKAGE_SHA256

      - name: Download frozen qualification inputs
        uses: actions/download-artifact@v4
        with:
          name: fhir-pkg-${{ needs.validate.outputs.version }}-fixture-bundle
          path: ${{ runner.temp }}/fixture-bundle

      - name: Qualify exact local package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
          QUALIFY_TITLE: qualify-${{ matrix.os }}-${{ matrix.framework }}
          BUNDLE_SHA256: ${{ needs.release-identity.outputs.bundle_sha256 }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ''
        run: |
          $cache = Join-Path '${{ runner.temp }}' 'qualification-cache'
          $report = Join-Path '${{ runner.temp }}' 'qualification-report.json'
          dotnet run `
            --project test/FhirPkg.Qualification/FhirPkg.Qualification.csproj `
            --configuration Release `
            --framework $env:TARGET_FRAMEWORK `
            --no-restore `
            "-p:TargetFramework=$env:TARGET_FRAMEWORK" `
            "-p:UsePublishedFhirPkg=true" `
            "-p:FhirPkgQualificationPackageVersion=$env:RELEASE_VERSION" `
            -- `
            --cache $cache `
            --output $report `
            --corpus test/FhirPkg.Qualification/qualification-corpus.json `
            --summary $env:GITHUB_STEP_SUMMARY `
            --summary-title $env:QUALIFY_TITLE `
            --bundle (Join-Path '${{ runner.temp }}' 'fixture-bundle') `
            --bundle-sha256 $env:BUNDLE_SHA256 `
            --release-tag $env:RELEASE_TAG

      - name: Report missing qualification report
        if: ${{ always() }}
        shell: pwsh
        run: |
          $report = Join-Path '${{ runner.temp }}' 'qualification-report.json'
          if (!(Test-Path -LiteralPath $report -PathType Leaf))
          {
            $message =
              'The qualification harness produced no report; the failing step above (restore, tool install, or smoke test) has the cause.'
            Write-Output "::error title=No qualification report::$message"
            try
            {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $message
            }
            catch
            {
              Write-Warning "The missing-report summary was not written: $($_.Exception.Message)"
            }
          }

      - name: Record qualification candidate evidence
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          SDK_PACKAGE_SHA256: ${{ needs.release-identity.outputs.sdk_package_sha256 }}
          CLI_PACKAGE_SHA256: ${{ needs.release-identity.outputs.cli_package_sha256 }}
          ARTIFACT_DIGEST: ${{ needs.release-identity.outputs.artifact_digest }}
          CANDIDATE_RUN_ID: ${{ needs.release-identity.outputs.candidate_run_id }}
          BUNDLE_SHA256: ${{ needs.release-identity.outputs.bundle_sha256 }}
          MODE: ${{ needs.validate.outputs.mode }}
          APPROVAL_COMMIT: ${{ needs.validate.outputs.approval_commit }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGET_FRAMEWORK: ${{ matrix.framework }}
          TOOL_INFORMATIONAL_VERSION: ${{ steps.tool_qualification.outputs.informational_version }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          $report =
            Get-Content `
              -Raw `
              -Path '${{ runner.temp }}/qualification-report.json' |
              ConvertFrom-Json
          if (!$report.success)
          {
            throw 'The qualification corpus did not succeed.'
          }

          $evidence = [ordered]@{
            version = $env:RELEASE_VERSION
            releaseTag = $env:RELEASE_TAG
            repositoryCommit = $env:RELEASE_COMMIT
            sdkPackageSha256 = $env:SDK_PACKAGE_SHA256
            cliPackageSha256 = $env:CLI_PACKAGE_SHA256
            workflowArtifactDigest = $env:ARTIFACT_DIGEST
            candidateRunId = $env:CANDIDATE_RUN_ID
            bundleSha256 = $env:BUNDLE_SHA256
            approvalCommit = $env:APPROVAL_COMMIT
            corpusSha256 = $report.corpusSha256
            mode = $env:MODE
            runId = $env:RUN_ID
            runAttempt = $env:RUN_ATTEMPT
            workflowSha = $env:WORKFLOW_SHA
            runner = $env:MATRIX_OS
            framework = $env:TARGET_FRAMEWORK
            toolInformationalVersion =
              $env:TOOL_INFORMATIONAL_VERSION
            corpusResult = 'passed'
          }
          $evidence |
            ConvertTo-Json |
            Set-Content `
              -Encoding utf8 `
              -Path '${{ runner.temp }}/qualification-candidate.json'

      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualification-candidate.json
            ${{ runner.temp }}/qualification-report.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: publish-nuget
    needs: [validate, release-identity, package-qualification]
    if: >-
      ${{
        !cancelled() &&
        needs.release-identity.result == 'success' &&
        needs.package-qualification.result == 'success' &&
        needs.validate.outputs.validation_only == 'false' &&
        (
          (github.event_name == 'release' &&
           github.event.action == 'published' &&
           github.event.release.tag_name == needs.validate.outputs.tag &&
           needs.validate.outputs.mode == 'release') ||
          (github.event_name == 'workflow_dispatch' &&
           needs.validate.outputs.mode == 'recovery' &&
           needs.validate.outputs.release_published == 'true')
        )
      }}
    runs-on: ubuntu-latest
    environment: nuget.org
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify exact source commit
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
          {
            throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
          }

      - name: Verify protected publishing environment
        shell: pwsh
        env:
          PUBLISH_ENVIRONMENT_READY: ${{ vars.NUGET_PUBLISH_ENVIRONMENT_READY }}
        run: |
          if ($env:PUBLISH_ENVIRONMENT_READY -cne 'true')
          {
            throw "The protected nuget.org environment is not configured."
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore release validation tool
        run: dotnet restore tools/FhirPkg.Release/FhirPkg.Release.csproj

      - name: Build release validation tool
        run: >-
          dotnet build tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-restore

      - name: Revalidate release tag and main ancestry
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-inputs
          --version "${{ needs.validate.outputs.version }}"
          --tag "${{ needs.validate.outputs.tag }}"
          --github-ref "${{ github.ref }}"
          --allow-published-version

      - name: Verify GitHub Release is published
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          verify-release-published
          --repository "${{ github.repository }}"
          --tag "${{ needs.validate.outputs.tag }}"

      - name: Download qualified release candidate
        uses: actions/download-artifact@v4
        with:
          name: fhir-pkg-${{ needs.validate.outputs.version }}-candidate
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ needs.release-identity.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Revalidate qualified release candidate
        id: candidate
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-candidate
          --candidate-directory "${{ runner.temp }}/release-candidate"
          --version "${{ needs.validate.outputs.version }}"
          --tag "${{ needs.validate.outputs.tag }}"
          --repository-commit "${{ needs.validate.outputs.commit }}"
          --expected-sdk-package-sha256 "${{ needs.release-identity.outputs.sdk_package_sha256 }}"
          --expected-cli-package-sha256 "${{ needs.release-identity.outputs.cli_package_sha256 }}"

      - name: Reconcile existing NuGet publication state
        id: publication_state
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          inspect-publication
          --candidate-directory "${{ runner.temp }}/release-candidate"
          --version "${{ needs.validate.outputs.version }}"
          --repository-commit "${{ needs.validate.outputs.commit }}"

      - name: Push CLI primary package to NuGet.org
        if: steps.publication_state.outputs.cli_state == 'missing'
        env:
          NUGET_API_KEY: ${{ secrets.GINOC_NUGET }}
        run: >-
          dotnet nuget push
          "${{ steps.candidate.outputs.cli_package_path }}"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --no-symbols
          --skip-duplicate

      - name: Verify published CLI primary matches candidate
        if: steps.publication_state.outputs.cli_state == 'missing'
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-published-package
          --package-id fhir-pkg-cli
          --candidate-package-path "${{ steps.candidate.outputs.cli_package_path }}"
          --published-package-uri "https://api.nuget.org/v3-flatcontainer/fhir-pkg-cli/${{ needs.validate.outputs.version }}/fhir-pkg-cli.${{ needs.validate.outputs.version }}.nupkg"
          --version "${{ needs.validate.outputs.version }}"
          --repository-commit "${{ needs.validate.outputs.commit }}"

      - name: Push SDK primary package to NuGet.org
        if: steps.publication_state.outputs.sdk_state == 'missing'
        env:
          NUGET_API_KEY: ${{ secrets.GINOC_NUGET }}
        run: >-
          dotnet nuget push
          "${{ steps.candidate.outputs.sdk_package_path }}"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --no-symbols
          --skip-duplicate

      - name: Verify published SDK primary matches candidate
        if: steps.publication_state.outputs.sdk_state == 'missing'
        run: >-
          dotnet run
          --project tools/FhirPkg.Release/FhirPkg.Release.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --no-restore
          --
          validate-published-package
          --package-id fhir-pkg-lib
          --candidate-package-path "${{ steps.candidate.outputs.sdk_package_path }}"
          --published-package-uri "https://api.nuget.org/v3-flatcontainer/fhir-pkg-lib/${{ needs.validate.outputs.version }}/fhir-pkg-lib.${{ needs.validate.outputs.version }}.nupkg"
          --version "${{ needs.validate.outputs.version }}"
          --repository-commit "${{ needs.validate.outputs.commit }}"

      - name: Push CLI symbols package to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.GINOC_NUGET }}
        run: >-
          dotnet nuget push
          "${{ steps.candidate.outputs.cli_symbols_path }}"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push SDK symbols package to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.GINOC_NUGET }}
        run: >-
          dotnet nuget push
          "${{ steps.candidate.outputs.sdk_symbols_path }}"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
