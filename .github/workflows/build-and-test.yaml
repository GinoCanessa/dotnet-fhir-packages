name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'FhirPkg.sln'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'FhirPkg.sln'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tools/**'
  workflow_call:
    inputs:
      commit_sha:
        description: Full source commit to build and test
        required: true
        type: string

permissions:
  contents: read

# vstest.console's default 90 s testhost connect window has been observed to
# expire on the 4 vCPU windows-latest runner, aborting a run with zero failing
# tests and only an untyped "MSB4181: ... returned false but did not log an
# error." Value is in seconds. Declared at workflow scope so it covers every
# dotnet test step in this file, including ones added later. Job-level
# timeout-minutes bounds the cost when a testhost genuinely never connects.
env:
  VSTEST_CONNECTION_TIMEOUT: "300"

jobs:
  build-and-test:
    name: build-and-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Deliberately loose: far above any plausible run duration, including the
    # serialized Unit tests step. This exists only to bound a genuine hang --
    # a testhost that never connects (300 s per step) or one that wedges mid-
    # execution, which the connect timeout does not cover at all. Without it
    # a wedged job runs to GitHub's 6-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs.commit_sha == '' }}

      - uses: actions/checkout@v6
        if: ${{ inputs.commit_sha != '' }}
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify exact source commit
        if: ${{ inputs.commit_sha != '' }}
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if ($env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$')
          {
            throw "Expected a full lowercase commit SHA, got '$env:EXPECTED_COMMIT'."
          }

          $actualCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
          {
            throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.302
            9.0.119
            8.0.423

      - name: Restore
        run: dotnet restore FhirPkg.sln

      - name: Build
        run: dotnet build FhirPkg.sln --configuration Release --no-restore

      # FhirPkg.Tests multi-targets net10.0;net9.0;net8.0 and this step
      # deliberately does not pin --framework, so MSBuild's
      # DispatchToInnerBuildsWithVSTestTarget would otherwise launch three
      # concurrent vstest.console + testhost pairs on a 4 vCPU runner. That
      # oversubscription starved testhost startup and silently aborted two of
      # the three per-framework runs. Serializing them via the
      # TestTfmsInParallel property is the fix -- do not remove this as an
      # "optimization".
      - name: Unit tests
        run: >-
          dotnet test test/FhirPkg.Tests/FhirPkg.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          -p:TestTfmsInParallel=false

      - name: Remaining integration tests (net10.0)
        run: >-
          dotnet test test/FhirPkg.IntegrationTests/FhirPkg.IntegrationTests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --verbosity normal
          --filter "FullyQualifiedName!~HardenedInstallationIntegrationTests&FullyQualifiedName!~CrossProcessCacheIntegrationTests"

      - name: Validate qualification corpus
        shell: pwsh
        run: |
          $cache = Join-Path '${{ runner.temp }}' 'qualification-validation-cache'
          $report = Join-Path '${{ runner.temp }}' 'qualification-validation.json'
          dotnet run `
            --project test/FhirPkg.Qualification/FhirPkg.Qualification.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-build `
            -- `
            --validate-only true `
            --cache $cache `
            --output $report `
            --corpus test/FhirPkg.Qualification/qualification-corpus.json

  hardened-integration:
    name: hardened-${{ matrix.os }}-${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net8.0, net9.0, net10.0]

    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs.commit_sha == '' }}

      - uses: actions/checkout@v6
        if: ${{ inputs.commit_sha != '' }}
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify exact source commit
        if: ${{ inputs.commit_sha != '' }}
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if ($env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$')
          {
            throw "Expected a full lowercase commit SHA, got '$env:EXPECTED_COMMIT'."
          }

          $actualCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:EXPECTED_COMMIT)
          {
            throw "Checked out '$actualCommit', expected '$env:EXPECTED_COMMIT'."
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.302
            9.0.119
            8.0.423

      - name: Restore
        run: dotnet restore test/FhirPkg.IntegrationTests/FhirPkg.IntegrationTests.csproj

      - name: Build
        run: >-
          dotnet build test/FhirPkg.IntegrationTests/FhirPkg.IntegrationTests.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-restore

      - name: Hardened integration tests
        run: >-
          dotnet test test/FhirPkg.IntegrationTests/FhirPkg.IntegrationTests.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-build
          --verbosity normal
          --filter "FullyQualifiedName~HardenedInstallationIntegrationTests|FullyQualifiedName~CrossProcessCacheIntegrationTests"
